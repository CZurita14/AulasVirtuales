# Sílabo → Aula virtual + BD vectorial. El modelo Qwen corre en el servidor de la UTI (QWEN_URL).
#   docker compose up -d --build      → http://localhost:8770
services:
  app:
    build: ./sistema
    ports:
      # Solo este equipo. El token de Canvas viaja en el formulario: para usarlo en red, poner delante
      # un proxy con HTTPS (Caddy/Nginx) y publicar solo el proxy, nunca este puerto en claro.
      - "127.0.0.1:8770:8770"
    env_file: .env
    environment:
      QDRANT_URL: http://qdrant:6333
      HISTORIAL_DB: /datos/historial.sqlite   # historial de cargas: sobrevive a reconstruir el contenedor
    volumes:
      - historial_data:/datos
    depends_on:
      - qdrant
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.20.0
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped
    # sin "ports": Qdrant solo es accesible para el sistema dentro de la red de Docker

  # Dirección pública FIJA con HTTPS (Tailscale Funnel): https://aulasvirtuales.<tu-tailnet>.ts.net
  # Solo se levanta con:  docker compose --profile publico up -d
  # La primera vez: `docker logs aulasvirtuales-silabos-funnel-1` muestra el enlace para iniciar sesión en Tailscale.
  funnel:
    image: tailscale/tailscale:v1.90.6
    profiles: ["publico"]
    hostname: aulasvirtuales
    environment:
      TS_HOSTNAME: aulasvirtuales
      TS_STATE_DIR: /var/lib/tailscale        # la identidad (y por tanto la dirección) se conserva aquí
      TS_USERSPACE: "true"
      TS_SERVE_CONFIG: /config/funnel.json
    volumes:
      - tailscale_estado:/var/lib/tailscale
      - ./deploy/tailscale:/config:ro
    depends_on:
      - app
    restart: unless-stopped

volumes:
  qdrant_data:
  historial_data:
  tailscale_estado:

# Evita que Docker asigne 172.18.0.0/16, utilizada por la red universitaria.
networks:
  default:
    ipam:
      config:
        - subnet: 192.168.240.0/24
